<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Painel de Alunos</h1>
            <p>Demonstração de CRUD Frontend/backend (Node.js)</p>
            <button onclick="window.print()" style="margin-top: 1rem; padding: 10px 
            20px; font-weight: bold; cursor: pointer;
            border-radius: 8px;
            border: none; background: bisque; color: var(--primary-color);">⬇️
            Baixar PDF </button>
        </header>
        <main>
            <section class="form-section">
                <h2>Novo Aluno</h2>
                <form id="aluno-form">
                    <input type="hidden" id="aluno-id">

                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome"
                        required placeholder="Ex: João da Silva">
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required placeholder="Ex: joao@email.com">
                    </div>
                    <div class="input-group">
                        <label for="curso">Curso</label>
                        <select id="curso" required>
                            <option value=""> Selecione um curso...</option>
                            <option value="Análise de Sistemas">Análise de Sistemas</option>
                            <option value="Engenharia de Sotfware"> Engenharia de Software</option>
                            <option value="Ciencia da Computação">Ciêmcia da Computação</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel"
                        id="btn-cancel" style="display: none;">Cancelar Edição</button>
                        <button type="submit" class="btn-save" id="btn-save">Salvar Aluno</button>
                    </div>
                </form>
            </section>
            <section class="list-section">
                <h2>Alunos Cadastrados</h2>
                <div class="table-container">
                    <table>
                        <thead><tr>
                            <tr>ID</tr>
                            <tr>Nome</tr>
                             <tr>E-mail</tr>
                              <tr>Curso</tr>
                               <tr>Ações</tr>
                        </tr>
                        </thead>
                        <tbody id="alunos-tbody">
                            <!-- Alunos serão injetados aqui via Javascript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
